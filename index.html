<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointercrate</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f4f4;
    color: #222;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
}

a {
    color: inherit;
    text-decoration: none;
}

button, select {
    font: inherit;
}

/* HEADER */

.header {
    background: #fff;
    border-bottom: 1px solid #ddd;
}

.header-inner {
    max-width: 1250px;
    min-height: 88px;
    margin: auto;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
}

.logo {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -1.5px;
    white-space: nowrap;
}

.logo span {
    color: #222;
}

.header-links {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 24px;
    font-size: 15px;
    font-weight: 600;
}

.header-links a:hover {
    text-decoration: underline;
}

.language {
    padding: 9px 11px;
    background: #fff;
    color: #222;
    border: 1px solid #ccc;
    cursor: pointer;
}

/* LIST TABS */

.navigation {
    background: #fff;
    border-bottom: 1px solid #d5d5d5;
}

.navigation-inner {
    max-width: 1250px;
    margin: auto;
    padding: 0 24px;
    display: flex;
}

.tab {
    padding: 19px 25px;
    border: none;
    border-bottom: 3px solid transparent;
    background: transparent;
    color: #333;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.tab:hover {
    background: #f7f7f7;
}

.tab.active {
    color: #222;
    border-bottom-color: #555;
}

/* DEMONLIST */

main {
    max-width: 1250px;
    margin: 30px auto;
    padding: 0 24px;
}

.demon-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

/* DEMON CARDS */

.demon-card {
    display: flex;
    align-items: stretch;
    min-height: 164px;
    gap: 21px;
    padding: 13px;
    background: #fff;
    border: 1px dotted #bdbdbd;
}

.demon-card:hover {
    border-color: #888;
}

.thumbnail {
    position: relative;
    flex: 0 0 220px;
    min-height: 136px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(ellipse at 25% 25%, #e6a650, transparent 35%),
        radial-gradient(ellipse at 80% 75%, #a94765, transparent 40%),
        linear-gradient(135deg, #302047, #151725 65%, #44254e);
}

.thumbnail img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.thumbnail-name {
    z-index: 1;
    padding: 12px;
    color: #fff;
    font-size: 23px;
    font-weight: 900;
    text-align: center;
    overflow-wrap: anywhere;
    text-shadow: 0 2px 5px #000;
}

.demon-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.demon-title {
    margin: 0 0 11px;
    font-size: 25px;
    line-height: 1.3;
    font-weight: 800;
    overflow-wrap: anywhere;
}

.rank {
    color: #333;
    margin-right: 7px;
}

.demon-name {
    color: #222;
}

.demon-name:hover {
    text-decoration: underline;
}

.published {
    color: #555;
    font-size: 16px;
}

.published strong {
    color: #222;
    font-weight: 700;
}

/* MOBILE */

@media (max-width: 800px) {
    .header-inner {
        align-items: flex-start;
        flex-direction: column;
        gap: 18px;
    }

    .header-links {
        justify-content: flex-start;
        gap: 16px;
    }
}

@media (max-width: 540px) {
    main {
        margin-top: 18px;
        padding: 0 10px;
    }

    .header-inner {
        padding: 16px;
    }

    .logo {
        font-size: 30px;
    }

    .header-links {
        font-size: 13px;
    }

    .navigation-inner {
        padding: 0 4px;
    }

    .tab {
        flex: 1;
        padding: 16px 5px;
        font-size: 13px;
    }

    .demon-card {
        min-height: 120px;
        gap: 12px;
        padding: 8px;
    }

    .thumbnail {
        flex-basis: 115px;
        min-height: 104px;
    }

    .thumbnail-name {
        font-size: 15px;
    }

    .demon-title {
        font-size: 18px;
        margin-bottom: 8px;
    }

    .published {
        font-size: 13px;
    }
}

@media (max-width: 350px) {
    .thumbnail {
        flex-basis: 90px;
    }

    .demon-title {
        font-size: 16px;
    }

    .published {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">

        <a href="#" class="logo">
            POINTER<span>CRATE</span>
        </a>

        <nav class="header-links">
            <a href="#api">REST API Documentation</a>
            <a href="#user-area">Pointercrate User Area</a>
            <a href="#demonlist">Geometry Dash Demonlist</a>

            <select class="language" aria-label="Language">
                <option value="en">🇺🇸 EN</option>
                <option value="de">🇩🇪 DE</option>
            </select>
        </nav>

    </div>
</header>

<nav class="navigation">
    <div class="navigation-inner">

        <button class="tab active" data-list="main">
            Main List
        </button>

        <button class="tab" data-list="extended">
            Extended List
        </button>

        <button class="tab" data-list="legacy">
            Legacy List
        </button>

    </div>
</nav>

<main id="demonlist">
    <section class="demon-list" id="demon-list"></section>
</main>

<script>
"use strict";

/*
    EDIT YOUR DEMONLIST HERE.

    rank: position in the selected list
    name: demon name
    publisher: level publisher
    list: main, extended or legacy
    image: thumbnail image URL, or "" for placeholder
*/

const demons = [
    {
        rank: 1,
        name: "Society",
        publisher: "Neomarbilan",
        list: "main",
        image: ""
    },
    {
        rank: 2,
        name: "Thinking Space II",
        publisher: "CairoX",
        list: "main",
        image: ""
    },
    {
        rank: 3,
        name: "Amethyst",
        publisher: "iMist",
        list: "main",
        image: ""
    },
    {
        rank: 4,
        name: "Flamewall",
        publisher: "Narwall",
        list: "main",
        image: ""
    },
    {
        rank: 5,
        name: "Tidal Wave",
        publisher: "OniLink",
        list: "main",
        image: ""
    },
    {
        rank: 6,
        name: "Green Bullet",
        publisher: "cherryteam",
        list: "main",
        image: ""
    },
    {
        rank: 7,
        name: "ORBIT",
        publisher: "MindCap",
        list: "main",
        image: ""
    },
    {
        rank: 8,
        name: "Antarctic Lights",
        publisher: "declanlc",
        list: "main",
        image: ""
    },
    {
        rank: 9,
        name: "Nullscapes",
        publisher: "Kiba",
        list: "main",
        image: ""
    },
    {
        rank: 10,
        name: "Quanteuse processing",
        publisher: "Renn241",
        list: "main",
        image: ""
    },

    {
        rank: 1,
        name: "Extended Example",
        publisher: "Example Creator",
        list: "extended",
        image: ""
    },
    {
        rank: 1,
        name: "Legacy Example",
        publisher: "Example Creator",
        list: "legacy",
        image: ""
    }
];

let activeList = "main";

const listElement = document.getElementById("demon-list");

function createDemonCard(demon) {
    const card = document.createElement("article");
    card.className = "demon-card";

    const thumbnail = document.createElement("div");
    thumbnail.className = "thumbnail";

    if (demon.image) {
        const image = document.createElement("img");
        image.src = demon.image;
        image.alt = demon.name;
        image.loading = "lazy";

        image.addEventListener("error", () => {
            image.remove();
        });

        thumbnail.appendChild(image);
    }

    const thumbnailName = document.createElement("div");
    thumbnailName.className = "thumbnail-name";
    thumbnailName.textContent = demon.name;
    thumbnail.appendChild(thumbnailName);

    const info = document.createElement("div");
    info.className = "demon-info";

    const title = document.createElement("h2");
    title.className = "demon-title";

    const rank = document.createElement("span");
    rank.className = "rank";
    rank.textContent = "#" + demon.rank + " –";

    const name = document.createElement("a");
    name.className = "demon-name";
    name.href = "#";
    name.textContent = demon.name;

    title.append(rank, name);

    const published = document.createElement("div");
    published.className = "published";

    const publisher = document.createElement("strong");
    publisher.textContent = demon.publisher;

    published.append(
        document.createTextNode("published by "),
        publisher
    );

    info.append(title, published);
    card.append(thumbnail, info);

    return card;
}

function renderList() {
    const visibleDemons = demons
        .filter(demon => demon.list === activeList)
        .sort((a, b) => a.rank - b.rank);

    listElement.replaceChildren();

    visibleDemons.forEach(demon => {
        listElement.appendChild(createDemonCard(demon));
    });
}

document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => {
        activeList = button.dataset.list;

        document.querySelectorAll(".tab").forEach(tab => {
            tab.classList.toggle("active", tab === button);
        });

        renderList();
    });
});

renderList();
</script>

</body>
</html>
