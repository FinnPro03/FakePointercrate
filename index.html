<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FakePointercrate | Geometry Dash Demonlist</title>

<style>
:root {
    --background: #f3f3f3;
    --white: #fff;
    --text: #333;
    --muted: #777;
    --border: #d8d8d8;
    --accent: #e04b43;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--background);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
}

button, input, select {
    font: inherit;
}

a {
    color: inherit;
    text-decoration: none;
}

/* HEADER */

.header {
    background: white;
    border-bottom: 1px solid #ddd;
}

.header-inner {
    max-width: 1200px;
    min-height: 76px;
    margin: auto;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
}

.logo {
    color: #292929;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1.5px;
    white-space: nowrap;
}

.logo span {
    color: var(--accent);
}

.logo-subtitle {
    display: block;
    margin-top: 3px;
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #888;
}

.header-links {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 20px;
    font-size: 12px;
}

.header-links a:hover {
    color: var(--accent);
}

.language {
    padding: 8px;
    background: white;
    border: 1px solid #ddd;
    cursor: pointer;
}

/* LIST NAVIGATION */

.navigation {
    background: white;
    border-bottom: 1px solid #d7d7d7;
}

.navigation-inner {
    max-width: 1200px;
    margin: auto;
    padding: 0 20px;
    display: flex;
}

.tab {
    padding: 17px 23px;
    border: 0;
    border-bottom: 3px solid transparent;
    background: transparent;
    color: #666;
    font-weight: bold;
    cursor: pointer;
}

.tab:hover {
    color: var(--accent);
}

.tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
}

/* MAIN PAGE */

main {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

.page-heading {
    margin-bottom: 22px;
}

.page-heading h1 {
    margin: 0 0 9px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.7px;
}

.page-heading p {
    margin: 0;
    color: var(--muted);
    line-height: 1.6;
}

/* SEARCH AND FILTER */

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}

.filter {
    width: 250px;
    max-width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    background: white;
    outline: none;
}

.filter:focus {
    border-color: #888;
}

.list-count {
    color: #777;
    font-size: 12px;
}

/* DEMON ENTRIES */

.demon-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.demon-card {
    display: flex;
    min-height: 140px;
    padding: 10px;
    gap: 17px;
    background: white;
    border: 1px dotted #c9c9c9;
    transition: border-color 0.15s;
}

.demon-card:hover {
    border-color: #999;
}

.thumbnail {
    position: relative;
    flex: 0 0 190px;
    min-height: 118px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(ellipse at 25% 25%, #e9a94b, transparent 35%),
        radial-gradient(ellipse at 80% 75%, #bd375c, transparent 40%),
        linear-gradient(135deg, #302047, #151725 65%, #44254e);
}

.thumbnail img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.thumbnail-name {
    z-index: 1;
    padding: 10px;
    color: white;
    font-size: 21px;
    font-weight: 900;
    text-align: center;
    overflow-wrap: anywhere;
    text-shadow: 0 2px 5px #000;
}

.demon-info {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.demon-title {
    margin: 0 0 9px;
    font-size: 21px;
    line-height: 1.3;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.demon-title .rank {
    color: #777;
    margin-right: 5px;
}

.demon-title .name {
    color: #292929;
}

.demon-title .name:hover {
    color: var(--accent);
}

.published {
    color: #777;
    font-size: 13px;
}

.published strong {
    color: #444;
    font-weight: bold;
}

/* EMPTY SEARCH RESULTS */

.empty {
    padding: 35px 20px;
    background: white;
    border: 1px dotted #ccc;
    color: #777;
    text-align: center;
}

/* FOOTER */

footer {
    max-width: 1160px;
    margin: 35px auto 0;
    padding: 20px;
    border-top: 1px solid #ddd;
    color: #888;
    font-size: 11px;
    line-height: 1.8;
}

footer strong {
    color: #555;
}

/* RESPONSIVE LAYOUT */

@media (max-width: 750px) {
    .header-inner {
        align-items: flex-start;
        flex-direction: column;
        gap: 14px;
    }

    .header-links {
        justify-content: flex-start;
        gap: 13px;
    }

    .tab {
        flex: 1;
        padding: 16px 7px;
        font-size: 12px;
    }

    .navigation-inner {
        padding: 0 8px;
    }

    main {
        margin-top: 22px;
        padding: 0 12px;
    }

    .demon-card {
        gap: 12px;
        min-height: 115px;
        padding: 8px;
    }

    .thumbnail {
        flex-basis: 115px;
        min-height: 100px;
    }

    .thumbnail-name {
        font-size: 15px;
    }

    .demon-title {
        font-size: 17px;
    }

    .published {
        font-size: 12px;
    }

    .filter {
        width: 100%;
    }

    .toolbar {
        align-items: stretch;
        flex-direction: column;
    }
}

@media (max-width: 380px) {
    .thumbnail {
        flex-basis: 92px;
    }

    .demon-title {
        font-size: 15px;
    }

    .logo {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">

        <a href="#" class="logo">
            POINTER<span>CRATE</span>
            <span class="logo-subtitle">FAKE DEMONLIST</span>
        </a>

        <nav class="header-links">
            <a href="#api">REST API Documentation</a>
            <a href="#user-area">Pointercrate User Area</a>
            <a href="#demonlist">Geometry Dash Demonlist</a>

            <select class="language" aria-label="Language">
                <option value="en">🇺🇸 EN</option>
                <option value="de">🇩🇪 DE</option>
            </select>
        </nav>

    </div>
</header>

<nav class="navigation">
    <div class="navigation-inner">

        <button class="tab active" data-list="main">
            Main List
        </button>

        <button class="tab" data-list="extended">
            Extended List
        </button>

        <button class="tab" data-list="legacy">
            Legacy List
        </button>

    </div>
</nav>

<main id="demonlist">

    <section class="page-heading">
        <h1 id="heading">Geometry Dash Demonlist</h1>
        <p id="description">
            The hardest rated levels in Geometry Dash.
        </p>
    </section>

    <section class="toolbar">
        <span class="list-count" id="count"></span>

        <input
            class="filter"
            id="filter"
            type="search"
            placeholder="Filter..."
            autocomplete="off"
            aria-label="Filter demons"
        >
    </section>

    <section class="demon-list" id="demon-list"></section>

</main>

<footer>
    <strong>FakePointercrate</strong>
    <br>
    Personal Geometry Dash Demonlist project.
    Unofficial and not affiliated with the original Pointercrate website.
</footer>

<script>
"use strict";

/* ========================================
   DEMON DATA

   Change names, publishers, ranks and image
   URLs here. No scoring fields are used.
======================================== */

const demons = [
    {
        rank: 1,
        name: "Society",
        publisher: "Neomarbilan",
        list: "main",
        image: ""
    },
    {
        rank: 2,
        name: "Thinking Space II",
        publisher: "CairoX",
        list: "main",
        image: ""
    },
    {
        rank: 3,
        name: "Amethyst",
        publisher: "iMist",
        list: "main",
        image: ""
    },
    {
        rank: 4,
        name: "Flamewall",
        publisher: "Narwall",
        list: "main",
        image: ""
    },
    {
        rank: 5,
        name: "Tidal Wave",
        publisher: "OniLink",
        list: "main",
        image: ""
    },
    {
        rank: 6,
        name: "Green Bullet",
        publisher: "cherryteam",
        list: "main",
        image: ""
    },
    {
        rank: 7,
        name: "ORBIT",
        publisher: "MindCap",
        list: "main",
        image: ""
    },
    {
        rank: 8,
        name: "Antarctic Lights",
        publisher: "declanlc",
        list: "main",
        image: ""
    },
    {
        rank: 9,
        name: "Nullscapes",
        publisher: "Kiba",
        list: "main",
        image: ""
    },
    {
        rank: 10,
        name: "Quanteuse processing",
        publisher: "Renn241",
        list: "main",
        image: ""
    },

    {
        rank: 1,
        name: "Extended Example",
        publisher: "Example Creator",
        list: "extended",
        image: ""
    },

    {
        rank: 1,
        name: "Legacy Example",
        publisher: "Example Creator",
        list: "legacy",
        image: ""
    }
];

/* ========================================
   PAGE SETTINGS
======================================== */

const pageSettings = {
    main: {
        heading: "Geometry Dash Demonlist",
        description:
            "The hardest rated levels in Geometry Dash."
    },

    extended: {
        heading: "Extended List",
        description:
            "Demons beyond the main section of the list."
    },

    legacy: {
        heading: "Legacy List",
        description:
            "Former list entries kept for historical purposes."
    }
};

let activeList = "main";

const listElement = document.getElementById("demon-list");
const filterInput = document.getElementById("filter");
const countElement = document.getElementById("count");

/* ========================================
   CREATE DEMON ENTRY
======================================== */

function createDemonCard(demon) {
    const card = document.createElement("article");
    card.className = "demon-card";

    const thumbnail = document.createElement("div");
    thumbnail.className = "thumbnail";

    if (demon.image) {
        const image = document.createElement("img");

        image.src = demon.image;
        image.alt = demon.name;
        image.loading = "lazy";

        image.addEventListener("error", () => {
            image.remove();
        });

        thumbnail.appendChild(image);
    }

    const thumbnailName = document.createElement("div");
    thumbnailName.className = "thumbnail-name";
    thumbnailName.textContent = demon.name;

    thumbnail.appendChild(thumbnailName);

    const info = document.createElement("div");
    info.className = "demon-info";

    const title = document.createElement("h2");
    title.className = "demon-title";

    const rank = document.createElement("span");
    rank.className = "rank";
    rank.textContent = "#" + demon.rank + " –";

    const name = document.createElement("a");
    name.className = "name";
    name.href = "#demon-" + slugify(demon.name);
    name.textContent = demon.name;
    name.title = demon.name;

    title.append(rank, name);

    const published = document.createElement("div");
    published.className = "published";

    const label = document.createTextNode("published by ");

    const publisher = document.createElement("strong");
    publisher.textContent = demon.publisher;

    published.append(label, publisher);

    info.append(title, published);
    card.append(thumbnail, info);

    return card;
}

/* ========================================
   CREATE URL-FRIENDLY DEMON IDENTIFIER
======================================== */

function slugify(name) {
    return name
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
}

/* ========================================
   RENDER DEMONLIST
======================================== */

function renderList() {
    const query = filterInput.value.trim().toLowerCase();

    const settings = pageSettings[activeList];

    document.getElementById("heading").textContent =
        settings.heading;

    document.getElementById("description").textContent =
        settings.description;

    const filteredDemons = demons
        .filter(demon => demon.list === activeList)
        .filter(demon =>
            demon.name.toLowerCase().includes(query) ||
            demon.publisher.toLowerCase().includes(query)
        )
        .sort((a, b) => a.rank - b.rank);

    listElement.replaceChildren();

    countElement.textContent =
        filteredDemons.length +
        (filteredDemons.length === 1
            ? " demon"
            : " demons");

    if (filteredDemons.length === 0) {
        const empty = document.createElement("div");

        empty.className = "empty";
        empty.textContent = "No demons found.";

        listElement.appendChild(empty);
        return;
    }

    filteredDemons.forEach(demon => {
        listElement.appendChild(createDemonCard(demon));
    });
}

/* ========================================
   SWITCH BETWEEN LISTS
======================================== */

document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => {
        activeList = button.dataset.list;

        document.querySelectorAll(".tab").forEach(tab => {
            tab.classList.toggle("active", tab === button);
        });

        filterInput.value = "";

        renderList();
    });
});

/* ========================================
   FILTER DEMONS
======================================== */

filterInput.addEventListener("input", renderList);

/* INITIALIZE */

renderList();
</script>

</body>
</html>
