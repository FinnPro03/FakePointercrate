<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pointercrate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ffffff;
            color: #222222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 17px;
        }

        a {
            color: #222222;
            text-decoration: none;
        }

        .top-header {
            min-height: 76px;
            padding: 0 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            border-bottom: 1px solid #dddddd;
            background: #ffffff;
        }

        .logo {
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -1.2px;
            white-space: nowrap;
        }

        .header-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 24px;
            font-size: 15px;
        }

        .header-links a:hover {
            text-decoration: underline;
        }

        .language-selector {
            padding: 8px 10px;
            border: 1px solid #dddddd;
            border-radius: 3px;
            background: #ffffff;
            color: #222222;
            font-size: 15px;
        }

        .tabs {
            display: flex;
            align-items: stretch;
            gap: 0;
            padding: 0 5%;
            border-bottom: 1px solid #d8d8d8;
            background: #f7f7f7;
        }

        .tab {
            padding: 19px 23px;
            border: none;
            border-bottom: 3px solid transparent;
            background: transparent;
            color: #444444;
            font-size: 17px;
            cursor: pointer;
        }

        .tab:hover {
            background: #eeeeee;
        }

        .tab.active {
            border-bottom-color: #333333;
            color: #111111;
            font-weight: 700;
        }

        .main-content {
            width: 100%;
            max-width: 1200px;
            margin: 28px auto;
            padding: 0 24px;
        }

        .demon-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .demon-card {
            display: flex;
            min-height: 150px;
            overflow: hidden;
            border: 1px dotted #bdbdbd;
            background: #ffffff;
            transition: background 0.15s ease;
        }

        .demon-card:hover {
            background: #f8f8f8;
        }

        .demon-thumbnail {
            width: 240px;
            min-width: 240px;
            min-height: 150px;
            align-self: stretch;
            display: block;
            object-fit: cover;
            background: linear-gradient(135deg, #444444, #999999);
        }

        .thumbnail-placeholder {
            width: 240px;
            min-width: 240px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: linear-gradient(135deg, #454545, #888888);
            color: #ffffff;
            font-size: 19px;
            font-weight: 700;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .demon-details {
            flex: 1;
            min-width: 0;
            padding: 18px 23px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 9px;
        }

        .demon-heading {
            display: flex;
            align-items: baseline;
            gap: 13px;
            flex-wrap: wrap;
        }

        .demon-rank {
            color: #555555;
            font-size: 22px;
            font-weight: 700;
        }

        .demon-name {
            color: #171717;
            font-size: 25px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .demon-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 28px;
            color: #555555;
            font-size: 16px;
            line-height: 1.5;
        }

        .meta-label {
            color: #333333;
            font-weight: 700;
        }

        .empty-list {
            padding: 40px 20px;
            border: 1px dotted #bdbdbd;
            color: #666666;
            text-align: center;
            font-size: 18px;
        }

        @media (max-width: 760px) {
            .top-header {
                align-items: flex-start;
                flex-direction: column;
                padding: 20px 5%;
            }

            .header-links {
                justify-content: flex-start;
                gap: 14px;
            }

            .tabs {
                padding: 0 3%;
            }

            .tab {
                flex: 1;
                padding: 15px 8px;
                font-size: 15px;
            }

            .main-content {
                margin-top: 18px;
                padding: 0 12px;
            }

            .demon-card {
                min-height: 120px;
            }

            .demon-thumbnail,
            .thumbnail-placeholder {
                width: 125px;
                min-width: 125px;
                min-height: 120px;
            }

            .demon-details {
                padding: 13px;
                gap: 8px;
            }

            .demon-heading {
                gap: 8px;
            }

            .demon-rank {
                font-size: 18px;
            }

            .demon-name {
                font-size: 20px;
            }

            .demon-meta {
                flex-direction: column;
                gap: 3px;
                font-size: 14px;
            }
        }

        @media (max-width: 420px) {
            .demon-thumbnail,
            .thumbnail-placeholder {
                width: 100px;
                min-width: 100px;
            }

            .demon-name {
                font-size: 18px;
            }

            .demon-details {
                padding: 10px;
            }
        }
    </style>
</head>

        function getYouTubeVideoId(url) {
            if (!url) {
                return "";
            }

            try {
                const parsedUrl = new URL(url);

                if (parsedUrl.hostname === "youtu.be") {
                    return parsedUrl.pathname.slice(1);
                }

                if (
                    parsedUrl.hostname.includes("youtube.com") ||
                    parsedUrl.hostname.includes("youtube-nocookie.com")
                ) {
                    return parsedUrl.searchParams.get("v") || "";
                }
            } catch (error) {
                return "";
            }

            return "";
        }

        function createDemonCard(demon) {
            const card = document.createElement("article");
            card.className = "demon-card";

            const videoId = getYouTubeVideoId(demon.videoUrl);

            if (videoId) {
                const thumbnail = document.createElement("img");
                thumbnail.className = "demon-thumbnail";

                // The URL is used only to load the thumbnail.
                // No video title or URL text is displayed.
                thumbnail.src =
                    "https://img.youtube.com/vi/" +
                    encodeURIComponent(videoId) +
                    "/hqdefault.jpg";

                thumbnail.alt = "";
                thumbnail.loading = "lazy";

                thumbnail.onerror = function () {
                    const placeholder = document.createElement("div");
                    placeholder.className = "thumbnail-placeholder";
                    placeholder.textContent = demon.name;
                    thumbnail.replaceWith(placeholder);
                };

                card.appendChild(thumbnail);
            } else {
                const placeholder = document.createElement("div");
                placeholder.className = "thumbnail-placeholder";
                placeholder.textContent = demon.name;
                card.appendChild(placeholder);
            }

            const details = document.createElement("div");
            details.className = "demon-details";

            const heading = document.createElement("div");
            heading.className = "demon-heading";

            const rank = document.createElement("span");
            rank.className = "demon-rank";
            rank.textContent = "#" + demon.rank;

            const name = document.createElement("span");
            name.className = "demon-name";
            name.textContent = demon.name;

            heading.appendChild(rank);
            heading.appendChild(name);

            const metadata = document.createElement("div");
            metadata.className = "demon-meta";

            const creator = document.createElement("span");
            const creatorLabel = document.createElement("span");
            creatorLabel.className = "meta-label";
            creatorLabel.textContent = "Creator: ";
            creator.appendChild(creatorLabel);
            creator.appendChild(document.createTextNode(demon.creator));

            const verifier = document.createElement("span");
            const verifierLabel = document.createElement("span");
            verifierLabel.className = "meta-label";
            verifierLabel.textContent = "Verifier: ";
            verifier.appendChild(verifierLabel);
            verifier.appendChild(document.createTextNode(demon.verifier));

            metadata.appendChild(creator);
            metadata.appendChild(verifier);

            details.appendChild(heading);
            details.appendChild(metadata);
            card.appendChild(details);

            return card;
        }

        function renderList(listName) {
            const demonList = document.getElementById("demonList");
            demonList.replaceChildren();

            const filteredDemons = demons
                .filter(demon => demon.list === listName)
                .sort((a, b) => a.rank - b.rank);

            if (filteredDemons.length === 0) {
                const emptyMessage = document.createElement("div");
                emptyMessage.className = "empty-list";
                emptyMessage.textContent = "No demons have been added to this list yet.";
                demonList.appendChild(emptyMessage);
                return;
            }

            filteredDemons.forEach(demon => {
                demonList.appendChild(createDemonCard(demon));
            });
        }

        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", function () {
                document.querySelectorAll(".tab").forEach(otherTab => {
                    otherTab.classList.remove("active");
                });

                this.classList.add("active");
                renderList(this.dataset.list);
            });
        });

        renderList("main");
